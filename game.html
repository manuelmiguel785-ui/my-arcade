<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Portal</title>
    <style>
        /* Modern streaming platform dark theme styling */
        body { 
            background: #141414; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            text-align: center;
        }

        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 5px; 
            letter-spacing: 1px;
            color: #fff;
        }

        .subtitle {
            color: #888;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        /* Responsive structural card grid block */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* Sleek game container layout */
        .card { 
            background: #1f1f1f; 
            border: 1px solid #2d2d2d; 
            border-radius: 12px; 
            overflow: hidden;
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Zoom and glow feedback animations on hovering */
        .card:hover { 
            transform: translateY(-5px) scale(1.03);
            border-color: #ffaa00; 
            box-shadow: 0 10px 20px rgba(255, 170, 0, 0.2);
        }

        /* Strict image aspect ratio container sandbox */
        .card img { 
            width: 100%; 
            aspect-ratio: 16/10; 
            object-fit: cover; 
            background: #2a2a2a;
            display: block;
            border-bottom: 1px solid #2d2d2d;
        }

        .card-info {
            padding: 15px;
            text-align: left;
        }

        .card h3 { 
            margin: 0 0 5px 0; 
            font-size: 1.1rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card p {
            margin: 0;
            font-size: 0.85rem;
            color: #888;
        }

        /* Fullscreen absolute overlay viewer sandbox box */
        .frame-container { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #000; 
            z-index: 10000; 
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        .close-btn { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: rgba(255, 51, 51, 0.9); 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s;
            z-index: 10001;
        }
        .close-btn:hover { background: #ff0000; transform: scale(1.05); }
    </style>
</head>
<body>

    <h1>Arcade Network</h1>
    <p class="subtitle">Select an application title from your grid array below:</p>

    <div class="grid" id="game-grid">
        
        <!-- Game Item 1: Direct path routing link -->
        <div class="card" onclick="openGame('./labubu.html')">
            <img src="https://crazygames.com" alt="Labubu Cart Ride" onerror="this.src='https://placehold.co'">
            <div class="card-info">
                <h3>Labubu Cart Ride</h3>
                <p>Arcade • Custom Canvas</p>
            </div>
        </div>

        <!-- Game Item 2: Retro Bowl External Backup Link -->
        <div class="card" onclick="openGame('https://github.io')">
            <img src="https://crazygames.com" alt="Retro Bowl">
            <div class="card-info">
                <h3>Retro Bowl</h3>
                <p>Sports • Retro</p>
            </div>
        </div>

    </div>

    <!-- Active Sandbox View Window Shell -->
    <div id="player" class="frame-container">
        <button class="close-btn" onclick="closeGame()">✕ Close Game</button>
        <iframe id="arcade-frame" src=""></iframe>
    </div>

    <script>
        function openGame(url) {
            document.getElementById('arcade-frame').src = url;
            document.getElementById('player').style.display = 'block';
        }
        function closeGame() {
            document.getElementById('player').style.display = 'none';
            document.getElementById('arcade-frame').src = '';
        }
    </script>
</body>
</html>
