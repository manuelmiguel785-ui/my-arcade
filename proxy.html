<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Utility Router</title>
    <style>
        body { background: #1c1c1c; color: #fff; font-family: sans-serif; text-align: center; padding-top: 100px; margin: 0; }
        .container { background: #2a2a2a; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 8px; border: 1px solid #444; }
        input[type="text"] { width: 80%; padding: 10px; margin-bottom: 20px; border: 1px solid #555; background: #111; color: #fff; border-radius: 4px; }
        button { padding: 10px 20px; background: #00ffcc; color: #111; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #00cc99; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Web Proxy Utility Routing</h2>
        <p>Enter a target web application endpoint address below:</p>
        <!-- Replace your backend URL path destination string inside the function below -->
        <input type="text" id="target-url" placeholder="https://example.com">
        <br>
        <button onclick="launchProxy()">Launch Stream</button>
    </div>
    <script>
        function launchProxy() {
            const destination = document.getElementById('target-url').value;
            if (destination) {
                alert("Routing utility destination set to: " + destination + "\\n(Note: This requires a live backend server to forward data.)");
            }
        }
    </script>
</body>
</html>
